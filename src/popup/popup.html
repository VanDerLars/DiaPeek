<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { width: 220px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
      a { color: #007aff; cursor: pointer; text-decoration: none; font-size: 12px; }
      a:hover { text-decoration: underline; }
      label { display: flex; align-items: center; gap: 8px; }
    </style>
  </head>
  <body>
    <h1>DiaPeek</h1>
    <div class="row">
      <label><input type="checkbox" id="enabled" checked /> <span data-i18n="popupEnabled">Enabled</span></label>
    </div>
    <div class="row">
      <a id="opts" data-i18n="popupSettings">Settings…</a>
    </div>
    <script src="../i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
